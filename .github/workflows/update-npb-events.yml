

name: Update NPB Events

on:
  schedule:
    # Taipei 11:00-22:00 = UTC 03:00-13:59
    - cron: '*/5 3-13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-npb-events
  cancel-in-progress: false

jobs:
  update-npb-events:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve NPB event date
        id: resolve_dates
        shell: bash
        run: |
          TAIPEI_TODAY=$(TZ=Asia/Taipei date +%F)
          echo "taipei_today=$TAIPEI_TODAY" >> "$GITHUB_OUTPUT"
          echo "NPB date: $TAIPEI_TODAY"

      - name: Fetch NPB events center data
        id: fetch_events_npb
        run: npm run fetch:events-npb

      - name: Verify NPB snapshot
        id: verify_npb
        run: test -f server/data/eventsCenter.npb.json

      - name: Validate NPB events center data
        id: validate_events
        run: npm run validate:events -- --league=NPB

      - name: Commit updated NPB events
        if: >
          steps.fetch_events_npb.outcome == 'success' &&
          steps.verify_npb.outcome == 'success' &&
          steps.validate_events.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add server/data/eventsCenter.npb.json

          if git diff --cached --quiet; then
            echo "No NPB event changes to commit."
            exit 0
          fi

          git commit -m "chore: update NPB events data"
          git pull --rebase origin main
          git push

      - name: Workflow summary
        if: always()
        run: |
          echo "## Update NPB Events Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| resolve date | ${{ steps.resolve_dates.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| fetch:events-npb | ${{ steps.fetch_events_npb.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| verify NPB snapshot | ${{ steps.verify_npb.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| validate:events | ${{ steps.validate_events.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if NPB update failed
        if: >
          steps.fetch_events_npb.outcome != 'success' ||
          steps.verify_npb.outcome != 'success' ||
          steps.validate_events.outcome != 'success'
        run: |
          echo "NPB event update failed."
          exit 1
