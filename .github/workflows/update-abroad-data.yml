name: Update Abroad Data

on:
  schedule:
    # Taipei 06:00-24:00 = UTC 22:00-23:59 + 00:00-15:59
    - cron: '*/30 22-23 * * *'
    - cron: '*/30 0-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-abroad-data
  cancel-in-progress: false

jobs:
  update-abroad-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export abroad seed
        id: export_seed
        run: npm run export:abroad-seed

      - name: Fetch abroad live data
        id: fetch_abroad
        run: npm run fetch:abroad-live

      - name: Verify abroad snapshots
        id: verify_abroad
        run: |
          test -f server/data/abroadPlayers.seed.json
          test -f server/data/abroadPlayers.live.json

      - name: Commit updated abroad data
        if: >
          steps.export_seed.outcome == 'success' &&
          steps.fetch_abroad.outcome == 'success' &&
          steps.verify_abroad.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add server/data/abroadPlayers.seed.json
          git add -f server/data/abroadPlayers.live.json

          if git diff --cached --quiet; then
            echo "No abroad data changes to commit."
            exit 0
          fi

          git commit -m "chore: update abroad players data"
          git pull --rebase origin main
          git push

      - name: Workflow summary
        if: always()
        run: |
          echo "## Update Abroad Data Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| export:abroad-seed | ${{ steps.export_seed.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| fetch:abroad-live | ${{ steps.fetch_abroad.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| verify abroad snapshots | ${{ steps.verify_abroad.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if abroad update failed
        if: >
          steps.export_seed.outcome != 'success' ||
          steps.fetch_abroad.outcome != 'success' ||
          steps.verify_abroad.outcome != 'success'
        run: |
          echo "Abroad data update failed."
          exit 1
