name: Update Baseball Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-baseball-data
  cancel-in-progress: false

jobs:
  update-baseball-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export abroad seed
        id: export_seed
        run: npm run export:abroad-seed

      - name: Fetch abroad live data
        id: fetch_abroad
        run: npm run fetch:abroad-live

      - name: Fetch CPBL events center data
        id: fetch_events_cpbl
        run: npm run fetch:events-cpbl

      - name: Fetch MLB events center data
        id: fetch_events_mlb
        run: npm run fetch:events-mlb

      - name: Fetch NPB events center data
        id: fetch_events_npb
        run: npm run fetch:events-npb

      - name: Fetch KBO events center data
        id: fetch_events_kbo
        run: npm run fetch:events-kbo

      - name: Verify data snapshots
        id: verify_files
        run: |
          test -f server/data/abroadPlayers.seed.json
          test -f server/data/abroadPlayers.live.json
          test -f server/data/eventsCenter.cpbl.json
          test -f server/data/eventsCenter.mlb.json
          test -f server/data/eventsCenter.npb.json
          test -f server/data/eventsCenter.kbo.json

      - name: Validate events center data
        id: validate_events
        run: npm run validate:events

      - name: Commit updated data
        if: >
          steps.export_seed.outcome == 'success' &&
          steps.fetch_abroad.outcome == 'success' &&
          steps.fetch_events_cpbl.outcome == 'success' &&
          steps.fetch_events_mlb.outcome == 'success' &&
          steps.fetch_events_npb.outcome == 'success' &&
          steps.fetch_events_kbo.outcome == 'success' &&
          steps.verify_files.outcome == 'success' &&
          steps.validate_events.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add server/data/abroadPlayers.seed.json
          git add -f server/data/abroadPlayers.live.json
          git add -f server/data/eventsCenter.cpbl.json
          git add -f server/data/eventsCenter.mlb.json
          git add -f server/data/eventsCenter.npb.json
          git add -f server/data/eventsCenter.kbo.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: update baseball data"
          git pull --rebase origin main
          git push

      - name: Workflow summary
        if: always()
        run: |
          echo "## Update Baseball Data Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| export:abroad-seed | ${{ steps.export_seed.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| fetch:abroad-live | ${{ steps.fetch_abroad.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| fetch:events-cpbl | ${{ steps.fetch_events_cpbl.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| fetch:events-mlb | ${{ steps.fetch_events_mlb.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| fetch:events-npb | ${{ steps.fetch_events_npb.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| fetch:events-kbo | ${{ steps.fetch_events_kbo.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| verify files | ${{ steps.verify_files.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| validate:events | ${{ steps.validate_events.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if aggregate update failed
        if: >
          steps.export_seed.outcome != 'success' ||
          steps.fetch_abroad.outcome != 'success' ||
          steps.fetch_events_cpbl.outcome != 'success' ||
          steps.fetch_events_mlb.outcome != 'success' ||
          steps.fetch_events_npb.outcome != 'success' ||
          steps.fetch_events_kbo.outcome != 'success' ||
          steps.verify_files.outcome != 'success' ||
          steps.validate_events.outcome != 'success'
        run: |
          echo "Baseball data aggregate update failed."
          exit 1
